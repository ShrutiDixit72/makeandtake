<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookstore - Feedback</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<header class="header">
<div class="logo">BS</div>
<div>
<div class="brand">The Classic Bookstore</div>
<div style="font-size:12px;opacity:0.9">Books • Authors • Reading</div>
</div>
</header>


<nav class="nav">
<a href="index.html">Home</a>
<a href="listofbooks.html">List of Books</a>
<a href="register.html">Customer Registration</a>
<a href="feedback.html">Feedback</a>
</nav>


<main class="info">
<h2>Feedback</h2>
<form id="fbForm" onsubmit="validateFeedback(event)">
<div class="form-row">
<label>
Your Name<br>
<input type="text" id="fbName" name="fbName" placeholder="Full name">
</label>
</div>
<div style="margin-top:12px">
<label>
Your Feedback<br>
<textarea id="fbText" name="fbText" rows="6" placeholder="Write your feedback here"></textarea>
</label>
</div>
<div style="margin-top:12px">
<button type="submit">SUBMIT</button>
<div id="fbError" class="error" aria-live="polite"></div>
</div>
</form>
</main>
<div class="footer">&copy; 2025 The Classic Bookstore</div>
</div>
<script src="script.js"></script>
</body>
</html>
